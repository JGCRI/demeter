name: build

on:
  push:
    branches: [main, "version/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # oversubscription of BLAS threads by the model's thread pools slows runs ~2.6x
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      # syntax errors and undefined names; the full rule set is enabled as the code is cleaned up (plan 7.4)
      - run: ruff check --select E9,F63,F7,F82 demeter benchmarks tests

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install ".[test]"
      - run: python -m pytest -m "not slow"

  test-full:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - deps: latest
            python-version: "3.13"
          - deps: minimum
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install minimum supported dependencies
        if: matrix.deps == 'minimum'
        run: |
          python -m pip install "numpy==1.26.*" "pandas==2.1.*" "scipy==1.11.*" "xarray==2024.1.*" \
            "netcdf4==1.6.4" "configobj==5.0.6" "requests==2.31.*"
      - run: python -m pip install ".[test]"
      - run: python -m pytest --durations=10

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - name: Run benchmark cases
        run: |
          for case in global_0p5deg texas_0p5deg; do
            python benchmarks/run_benchmark.py --case $case --out benchmarks/results/ci_$case --repeat 1
          done
      - name: Compare against the current baseline
        run: |
          baseline=$(cat benchmarks/baselines/CURRENT)
          status=0
          for case in global_0p5deg texas_0p5deg; do
            python benchmarks/compare.py benchmarks/baselines/$baseline/$case benchmarks/results/ci_$case \
              --markdown benchmarks/results/compare_$case.md || status=1
            cat benchmarks/results/compare_$case.md >> "$GITHUB_STEP_SUMMARY"
          done
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: benchmarks/results/
